# CRS Setup - TESTING MODE for ModIntel
# Enhanced logging for rule feature extraction

# Log all rule matches (not just nolog)
SecDefaultAction "phase:1,pass,log,tag:'coraza'"
SecDefaultAction "phase:2,pass,log,tag:'coraza'"

SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.paranoia_level=2,\
   setvar:tx.blocking_paranoia_level=2"

# TESTING: Lower thresholds to capture more rule firings
SecAction \
  "id:900110,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.inbound_anomaly_score_threshold=5,\
   setvar:tx.outbound_anomaly_score_threshold=4"

# TESTING: Enable detailed rule logging
SecAction \
  "id:900115,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.do_reput_block=0,\
   setvar:tx.allowed_methods=GET HEAD POST OPTIONS,\
   setvar:tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/x-amf| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|,\
   setvar:tx.allowed_request_content_type_charset=|utf-8| |iso-8859-1| |iso-8859-15| |windows-1252|,\
   setvar:tx.allowed_http_versions=HTTP/0.9 HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0"

SecAction \
    "id:900990,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.25.0',\
    setvar:tx.crs_setup_version=4250"
