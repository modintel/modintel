<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Rule Inventory</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/rules.css">
</head>

<body data-attach-logout="false">
    <nav>
        <div class="nav-brand">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff570a" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span style="color: #ff570a;">MODINTEL</span>
        </div>
        <div class="nav-links">
            <a href="/events">Events</a>
            <a href="/rules" class="active">Rules</a>
            <a href="/training">Training</a>
            <a href="/datasets">Datasets</a>
            <a href="/reports">Reports</a>
            <a href="/monitor">Monitor</a>
            <a href="/settings">Settings</a>
        </div>
        <div class="nav-actions"></div>
    </nav>
    <div class="main">
        <div class="panel-left">
            <div class="hero-eyebrow">Policy</div>
            <h1>Rule Intelligence</h1>
            <p>Active security signatures currently enforced by the ModIntel engine.</p>

            <div class="rule-mode-toggle">
                <button class="rule-mode-btn active" data-mode="write">Write</button>
                <button class="rule-mode-btn" data-mode="edit">Edit</button>
            </div>
            <div class="rule-editor" id="write-rule-section">
                <h3>Write Custom Rule</h3>
                <div class="form-group">
                    <label>Rule ID</label>
                    <input type="text" id="rule-id" placeholder="990100">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="rule-category">
                        <option value="SQLi">SQL Injection</option>
                        <option value="XSS">XSS Attack</option>
                        <option value="RCE">RCE Attack</option>
                        <option value="LFI">Path Traversal</option>
                        <option value="RFI">RFI Attack</option>
                        <option value="Protocol">Protocol</option>
                        <option value="Custom">Custom</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="rule-desc" placeholder="Brief description of the rule">
                </div>
                <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div>
                        <label>Severity</label>
                        <select id="rule-severity">
                            <option value="CRITICAL">CRITICAL</option>
                            <option value="HIGH">HIGH</option>
                            <option value="MEDIUM" selected>MEDIUM</option>
                            <option value="LOW">LOW</option>
                        </select>
                    </div>
                    <div>
                        <label>Phase</label>
                        <select id="rule-phase">
                            <option value="1">Phase 1 - Request Headers</option>
                            <option value="2" selected>Phase 2 - Request Body</option>
                            <option value="3">Phase 3 - Response Headers</option>
                            <option value="4">Phase 4 - Response Body</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" id="save-rule-btn" type="button">Add Rule</button>
                    <button class="btn btn-secondary" id="clear-rule-btn" type="button">Clear</button>
                </div>
            </div>
            <div class="rule-editor" id="edit-rule-section" style="display:none;">
                <h3>Edit Custom Rule <span id="edit-rule-id-display" style="color:#ff570a;font-weight:600;"></span></h3>
                <div class="form-group">
                    <label>Category</label>
                    <select id="edit-rule-category">
                        <option value="SQLi">SQL Injection</option>
                        <option value="XSS">XSS Attack</option>
                        <option value="RCE">RCE Attack</option>
                        <option value="LFI">Path Traversal</option>
                        <option value="RFI">RFI Attack</option>
                        <option value="Protocol">Protocol</option>
                        <option value="Custom">Custom</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="edit-rule-desc" placeholder="Brief description of the rule">
                </div>
                <div class="form-group">
                    <label>Severity</label>
                    <select id="edit-rule-severity">
                        <option value="CRITICAL">CRITICAL</option>
                        <option value="HIGH">HIGH</option>
                        <option value="MEDIUM">MEDIUM</option>
                        <option value="LOW">LOW</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phase</label>
                    <select id="edit-rule-phase">
                        <option value="1">Phase 1 - Request Headers</option>
                        <option value="2">Phase 2 - Request Body</option>
                        <option value="3">Phase 3 - Response Headers</option>
                        <option value="4">Phase 4 - Response Body</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" id="save-edit-btn" type="button">Save Changes</button>
                    <button class="btn btn-secondary" id="cancel-edit-btn" type="button">Cancel</button>
                </div>
            </div>
        </div>
        <div class="panel-right" style="overflow: hidden;">
            <div class="panel-right-header">
                <div class="header-left-group">
                    <div
                        style="font-size: 0.75rem; text-transform: uppercase; color: var(--fg-subtle); font-weight: 600; letter-spacing: 0.05em;">
                        Security Signatures</div>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <div class="rules-tabs">
<button class="rules-tab active" data-type="crs">CRS Rules</button>
                        <button class="rules-tab" data-type="custom">Custom Rules</button>
                        <button class="rules-tab" data-type="regex">Regex Signatures</button>
                        </div>
                        <span id="rule-count" style="color: #ff570a; font-weight: 600; white-space: nowrap;"></span>
                    </div>
                </div>
                <div class="restart-notice-wrap">
                    <div class="restart-notice">Changes require WAF restart to take effect.</div>
                    <button class="btn btn-secondary restart-btn" id="restart-waf-btn" type="button">Restart WAF</button>
                </div>
            </div>
            <div class="rules-filters" style="padding: 1rem; border-bottom: 1px solid var(--border); display: flex; gap: 1rem; align-items: center;">
                <input type="text" id="rule-search" placeholder="Search by ID or description..." style="flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg);">
                <button id="clear-search-btn" style="display:none; padding: 0.35rem 0.65rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg-muted); cursor: pointer; font-size: 0.75rem; white-space: nowrap;">Clear</button>
                <select id="category-filter" style="padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg);">
                    <option value="">All Categories</option>
                    <option value="SQLi">SQLi</option>
                    <option value="XSS">XSS</option>
                    <option value="LFI">LFI</option>
                    <option value="RFI">RFI</option>
                    <option value="RCE">RCE</option>
                    <option value="CMDi">CMDi</option>
                    <option value="NoSQLi">NoSQLi</option>
                    <option value="SSTI">SSTI</option>
                    <option value="SSRF">SSRF</option>
                    <option value="XXE">XXE</option>
                    <option value="Protocol">Protocol</option>
                    <option value="Scanner">Scanner</option>
                    <option value="Generic">Generic</option>
                </select>
                <select id="paranoia-filter" style="padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); display: none;">
                    <option value="">All Paranoia Levels</option>
                    <option value="1">PL1 - Basic</option>
                    <option value="2">PL2 - Moderate</option>
                    <option value="3">PL3 - High</option>
                    <option value="4">PL4 - Extreme</option>
                </select>
            </div>
            <div class="log-scroll">
                <table class="rules-table">
<thead>
                        <tr>
                            <th style="width: 16%;">Rule ID</th>
                            <th style="width: 16%;">Category</th>
                            <th style="width: 30%;">Description</th>
                            <th style="width: 20%;">Status</th>
                        </tr>
                    </thead>
                    <tbody id="rules-tbody">
                    </tbody>
                </table>
                <div id="pagination-controls" style="display: flex; justify-content: center; align-items: center; padding: 1rem; gap: 1rem;"></div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/boot.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/rules.js"></script>
</body>

</html>
