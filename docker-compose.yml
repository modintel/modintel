services:
  mongodb:
    image: mongo:7
    command: --replSet rs0 --wiredTigerCacheSizeGB 1
    volumes:
      - modintel_mongo_data:/data/db
    networks:
      - modintel-net
    ports:
      - "127.0.0.1:27018:27017"
    restart: always

  proxy-waf-custom:
    build: ./services/proxy-waf-custom
    volumes:
      - ./services/proxy-waf-custom/Caddyfile:/etc/caddy/Caddyfile
      - modintel_caddy_logs:/var/log/caddy
    networks:
      - modintel-net
    ports:
      - "3000:3000"
    restart: always
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile

  proxy-waf:
    image: ghcr.io/coreruleset/coraza-crs:caddy-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./proxy-waf/Caddyfile:/config/caddy/Caddyfile
      - ./proxy-waf/coraza.conf:/opt/coraza/config.d/user.conf
      - ./proxy-waf/custom_rules.conf:/opt/coraza/config.d/custom.conf
      - ./proxy-waf/crs-setup.conf:/opt/coraza/config/crs-setup.conf
      - ./proxy-waf/overrides:/opt/coraza/overrides
      - modintel_waf-logs:/var/log/coraza
      - modintel_caddy_logs:/var/log/caddy
      - modintel_crs-rules:/opt/coraza/owasp-crs/rules:ro
    environment:
      - BACKEND=juice-shop:3000
      - CORAZA_AUDIT_LOG=/var/log/coraza/audit.json
      - MANUAL_MODE=true
    networks:
      - modintel-net
    restart: always
    user: root

  waf-blocker:
    build: ./services/waf-blocker
    volumes:
      - ./services/log-collector/signatures:/app/signatures:ro
    environment:
      - SIGNATURES_FILE=/app/signatures/modintel_regex.signatures
      - INFERENCE_URL=http://inference-engine:8083/predict-miss
      - BACKEND_URL=http://juice-shop:3000
      - REPORT_URL=http://log-collector:8081/api/waf/block-event
    networks:
      - modintel-net
    restart: always

  juice-shop:
    image: bkimminich/juice-shop:latest
    networks:
      - modintel-net
    restart: always

  log-collector:
    build: ./services/log-collector
    volumes:
      - modintel_caddy_logs:/var/log/caddy:ro
      - modintel_waf-logs:/var/log/coraza:ro
      - ./services/log-collector/signatures:/app/signatures:ro
    environment:
      - CADDY_LOG_PATH=/var/log/caddy/waf-access.json
      - CORAZA_LOG_PATH=/var/log/coraza/audit.json
      - MONGO_URI=${MONGO_URI}
      - INFERENCE_ENGINE_URL=${INFERENCE_ENGINE_URL}
      - MODINTEL_SIGNATURES_FILE=/app/signatures/modintel_regex.signatures
    networks:
      - modintel-net
    ports:
      - "8081:8081"
    restart: always

  inference-engine:
    build: ./services/inference-engine
    ports:
      - "8083:8083"
    volumes:
      - ./models:/app/models:ro
      - ./services/inference-engine:/app
    environment:
      - MODEL_VERSION=v3
      - MISS_ONNX_MODEL_PATH=/app/models/modintel.onnx
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
    mem_limit: 2g
    restart: always
    networks:
      - modintel-net

  review-api:
    build: ./services/review-api
    ports:
      - "8082:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./proxy-waf/overrides:/waf-overrides
      - ./proxy-waf/custom_rules.conf:/waf-overrides/custom_rules.conf
      - .:/project:rw
      - ./dashboard:/srv/dashboard:ro
      - modintel_crs-rules:/crs-rules:ro
      - ./services/log-collector/signatures:/app/signatures:ro
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
      - WAF_ENGINE=Coraza
      - BACKEND_TARGET=${BACKEND_TARGET}
      - INFERENCE_ENGINE_URL=${INFERENCE_ENGINE_URL}
      - WAF_OVERRIDES_FILE=/waf-overrides/managed-overrides.conf
      - CUSTOM_RULES_PATH=/waf-overrides/custom_rules.conf
      - CRS_RULES_PATH=/crs-rules
    networks:
      - modintel-net
    restart: always
    user: root

  health-aggregator:
    build: ./services/health-aggregator
    ports:
      - "8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HEALTH_AGG_ADDR=:8090
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
    networks:
      - modintel-net
    restart: always
    user: root

  training-api:
    build:
      context: .
      dockerfile: services/training-api/Dockerfile
    ports:
      - "8085:8085"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - modintel_caddy_logs:/var/log/caddy:ro
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
      - MODEL_VERSION=${MODEL_VERSION:-v3}
      - ML_PIPELINE_DATA_DIR=/app/data
      - ML_PIPELINE_MODELS_DIR=/app/models
      - TRAIN_SCRIPT=/app/ml-pipeline/train_model.py
    networks:
      - modintel-net
    restart: always
    user: root

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - modintel-net
    restart: always

  auth-service:
    build: ./services/auth-service
    ports:
      - "8084:8084"
    environment:
      - AUTH_PORT=${AUTH_PORT}
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY}
      - BCRYPT_COST=${BCRYPT_COST}
      - RATE_LIMIT_AUTH=${RATE_LIMIT_AUTH}
      - AUTH_BOOTSTRAP_ADMIN_EMAIL=${AUTH_BOOTSTRAP_ADMIN_EMAIL}
      - AUTH_BOOTSTRAP_ADMIN_PASSWORD=${AUTH_BOOTSTRAP_ADMIN_PASSWORD}
      - AUTH_BOOTSTRAP_ADMIN_ROLE=${AUTH_BOOTSTRAP_ADMIN_ROLE}
      - AUTH_BOOTSTRAP_ADMIN_NAME=${AUTH_BOOTSTRAP_ADMIN_NAME}
      - AUTH_APP_BASE_URL=http://localhost:3000
    networks:
      - modintel-net
    restart: always

networks:
  modintel-net:
    name: modintel_net

volumes:
  modintel_waf-logs:
    name: modintel_waf-logs
  modintel_mongo_data:
    name: modintel_mongo_data
  modintel_caddy_logs:
    name: modintel_caddy_logs
  modintel_crs-rules:
    name: modintel_crs-rules
