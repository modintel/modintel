name: docker-build-publish

on:
  push:
    branches: [modintel-base]
  pull_request:
    branches: [modintel-base]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push log collector
        uses: docker/build-push-action@v7
        with:
          context: ./services/log-collector
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/log-collector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build and push inference engine
        uses: docker/build-push-action@v7
        with:
          context: ./services/inference-engine
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/inference-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build and push review api
        uses: docker/build-push-action@v7
        with:
          context: ./services/review-api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/review-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build and push auth service
        uses: docker/build-push-action@v7
        with:
          context: ./services/auth-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build and push proxy waf custom
        uses: docker/build-push-action@v7
        with:
          context: ./services/proxy-waf-custom
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy-waf-custom:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build and push health aggregator
        uses: docker/build-push-action@v7
        with:
          context: ./services/health-aggregator
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/health-aggregator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build and push training api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/training-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/training-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build and push waf blocker
        uses: docker/build-push-action@v7
        with:
          context: ./services/waf-blocker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/waf-blocker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
